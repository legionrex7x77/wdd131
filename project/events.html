    <link rel="stylesheet" href="styles/project.css">

<body>
    <header>

            <div class="header-controls">

                <button id="menu-btn" class="hamburger" aria-label="Toggle navigation menu">&#9776;</button>
            </div>
        </div>
        <nav id="nav-bar" aria-label="Main Navigation">
